<!-- Shell provisório da Etapa 1 — substituído pelos componentes de seção na Etapa 2 -->
<main class="section">
  <div class="container">
    <p class="overline">{{ hero.overline }}</p>
    <h1>{{ hero.titulo }}</h1>
    <p>{{ hero.subtitulo }}</p>
    <p>
      <a
        class="btn btn--primary"
        [href]="linkWhatsApp(hero.ctaPrimario.mensagem)"
        target="_blank"
        rel="noopener"
        >{{ hero.ctaPrimario.rotulo }}</a
      >
    </p>
  </div>
</main>
